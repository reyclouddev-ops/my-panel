<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReyCloud Master Daemon Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-3 sm:p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- HEADER -->
    <header class="flex flex-col md:flex-row justify-between items-stretch md:items-center bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl gap-4">
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-sky-400 tracking-wider flex items-center gap-2">
          <span>⚡</span> REYCLOUD DAEMON
        </h1>
        <p class="text-xs text-slate-400 mt-1">Full Web-Controlled Multi-Server & Terminal Engine</p>
      </div>
      
      <form id="createForm" class="flex gap-2">
        <input type="text" id="serverName" placeholder="Nama Instance (contoh: rest-api)" required 
          class="bg-slate-950 border border-slate-700 text-xs sm:text-sm rounded-xl px-3.5 py-2.5 text-slate-200 focus:outline-none focus:border-sky-500 w-full md:w-64">
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm px-4 py-2.5 rounded-xl transition-all shadow-md whitespace-nowrap cursor-pointer">
          + Buat Server
        </button>
      </form>
    </header>

    <!-- REMOTE TERMINAL -->
    <section class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-sm sm:text-base font-bold text-sky-400 flex items-center gap-2">
          <span>💻</span> Global Terminal Command
        </h3>
        <span class="text-[11px] text-slate-400">Jalankan npm install, git, dll langsung dari web</span>
      </div>

      <div class="flex flex-col sm:flex-row gap-2">
        <input type="text" id="termFolder" placeholder="Folder (kosong jika root)" 
          class="bg-slate-950 border border-slate-700 text-xs rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-sky-500 sm:w-1/4">
        <input type="text" id="termCmd" placeholder="Perintah (contoh: npm install multer --ignore-scripts)" 
          class="bg-slate-950 border border-slate-700 text-xs rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-sky-500 flex-1 font-mono">
        <button onclick="runTerminal()" class="bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs px-5 py-2 rounded-xl transition-all shadow-md cursor-pointer">
          ▶ Eksekusi
        </button>
      </div>

      <div class="relative">
        <div class="absolute top-2 right-2 text-[10px] text-slate-500 font-mono uppercase tracking-widest bg-slate-950 px-2 py-0.5 rounded border border-slate-800">Terminal Output</div>
        <pre id="terminalLogs" class="bg-slate-950 border border-slate-800 p-4 rounded-xl font-mono text-xs text-emerald-400 h-40 overflow-y-auto whitespace-pre-wrap break-all shadow-inner">Menghubungkan ke daemon terminal...</pre>
      </div>
    </section>

    <!-- INSTANCES GRID -->
    <section class="space-y-4">
      <h3 class="text-base sm:text-lg font-bold text-slate-200 flex items-center gap-2">
        <span>🚀</span> Active Instances & REST APIs
      </h3>
      <div id="serverContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="col-span-full bg-slate-900 border border-slate-800 p-8 rounded-2xl text-center text-slate-400">
          Memuat daftar instance server...
        </div>
      </div>
    </section>

  </div>

  <script>
    async function fetchData() {
      try {
        const res = await fetch('/api/servers');
        const data = await res.json();
        
        const termBox = document.getElementById('terminalLogs');
        termBox.innerText = data.terminalLogs;
        termBox.scrollTop = termBox.scrollHeight;

        const container = document.getElementById('serverContainer');
        if (data.servers.length === 0) {
          container.innerHTML = `
            <div class="col-span-full bg-slate-900 border border-slate-800 p-8 rounded-2xl text-center text-slate-400 text-xs sm:text-sm">
              Belum ada instance server. Silakan buat baru melalui form di atas!
            </div>`;
          return;
        }

        container.innerHTML = data.servers.map(s => `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between space-y-4 border-l-4 ${s.running ? 'border-l-emerald-500' : 'border-l-rose-500'}">
            
            <div class="flex justify-between items-start">
              <div>
                <h4 class="text-base sm:text-lg font-bold text-white tracking-wide font-mono">${s.name}</h4>
                <div class="flex items-center gap-2 mt-1">
                  <span class="inline-block w-2.5 h-2.5 rounded-full ${s.running ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'}"></span>
                  <span class="text-[11px] font-semibold ${s.running ? 'text-emerald-400' : 'text-rose-400'}">${s.running ? 'RUNNING' : 'STOPPED'}</span>
                </div>
              </div>
              <a href="/manage.html?folder=${s.name}" class="bg-slate-800 hover:bg-slate-700 text-sky-400 text-xs font-bold px-3 py-2 rounded-xl border border-slate-700 transition-all flex items-center gap-1.5 shadow">
                <span>⚙️</span> Config & Files
              </a>
            </div>

            <div class="flex gap-2">
              ${!s.running ? `
                <button onclick="controlServer('${s.name}', 'start')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2.5 rounded-xl transition-all cursor-pointer shadow">
                  ▶ Start Server
                </button>
              ` : `
                <button onclick="controlServer('${s.name}', 'restart')" class="flex-1 bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs py-2.5 rounded-xl transition-all cursor-pointer shadow">
                  🔄 Restart
                </button>
                <button onclick="controlServer('${s.name}', 'stop')" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs py-2.5 rounded-xl transition-all cursor-pointer shadow">
                  🛑 Stop
                </button>
              `}
            </div>

            <div class="space-y-1">
              <div class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Console Output (${s.name})</div>
              <pre class="bg-slate-950 border border-slate-800 p-3 rounded-xl font-mono text-[11px] text-emerald-400 h-28 overflow-y-auto whitespace-pre-wrap break-all shadow-inner">${s.logs}</pre>
            </div>

          </div>
        `).join('');

      } catch (e) {
        console.error("Gagal memuat data daemon:", e);
      }
    }

    async function controlServer(name, action) {
      await fetch(`/api/servers/${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      fetchData();
    }

    async function runTerminal() {
      const folder = document.getElementById('termFolder').value.trim();
      const command = document.getElementById('termCmd').value.trim();
      if (!command) return alert('Masukkan perintah terminal terlebih dahulu!');

      document.getElementById('termCmd').value = '';
      await fetch('/api/terminal/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ folder, command })
      });
      fetchData();
    }

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('serverName').value.trim();
      await fetch('/api/servers/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ servername: name })
      });
      document.getElementById('serverName').value = '';
      fetchData();
    });

    setInterval(fetchData, 3000);
    fetchData();
  </script>
</body>
</html>

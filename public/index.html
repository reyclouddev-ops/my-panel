<!DOCTYPE html>
<html lang="id" data-theme="sky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReyCloud Master Daemon Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #07090e; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    
    /* THEME ACCENT COLORS */
    html[data-theme="sky"] { --accent-glow: rgba(14, 165, 233, 0.1); --accent-color: #0ea5e9; }
    html[data-theme="emerald"] { --accent-glow: rgba(16, 185, 129, 0.1); --accent-color: #10b981; }
    html[data-theme="violet"] { --accent-glow: rgba(139, 92, 246, 0.1); --accent-color: #8b5cf6; }
    html[data-theme="amber"] { --accent-glow: rgba(245, 158, 11, 0.1); --accent-color: #f59e0b; }
  </style>
</head>
<body class="bg-[#030712] text-slate-100 font-sans min-h-screen selection:bg-sky-500 selection:text-white pb-12">
  
  <!-- BACKGROUND AMBIENT GLOW -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[600px] h-[250px] blur-[120px] pointer-events-none rounded-full" style="background-color: var(--accent-glow);"></div>

  <div class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6 relative z-10">
    
    <!-- HEADER -->
    <header class="flex flex-col lg:flex-row justify-between items-stretch lg:items-center bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 p-5 sm:p-6 rounded-3xl shadow-2xl gap-5">
      <div class="flex items-center justify-between w-full lg:w-auto">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-sky-500 to-blue-700 flex items-center justify-center shadow-lg shadow-sky-500/20 text-2xl">
            ⚡
          </div>
          <div>
            <h1 class="text-xl sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-sky-400 tracking-wider">
              REYCLOUD
            </h1>
            <p class="text-xs text-slate-400 mt-0.5 flex items-center gap-1.5 font-medium">
              <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> 
              Engine Multi-Server & Watcher
            </p>
          </div>
        </div>

        <!-- THEME SELECTOR MOBILE BUTTON -->
        <div class="lg:hidden">
          <select id="themeSelectMobile" onchange="changeTheme(this.value)" class="bg-slate-950 border border-slate-700 text-xs text-slate-300 rounded-xl px-2.5 py-2 focus:outline-none">
            <option value="sky">🌌 Sky</option>
            <option value="emerald">🌿 Emerald</option>
            <option value="violet">🔮 Violet</option>
            <option value="amber">🔥 Amber</option>
          </select>
        </div>
      </div>
      
      <div class="flex flex-col sm:flex-row items-center gap-3 w-full lg:w-auto">
        <form id="createForm" class="flex flex-col sm:flex-row gap-2.5 w-full lg:w-auto">
          <div class="relative flex-1 lg:w-64">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-xs">📁</span>
            <input type="text" id="serverName" placeholder="Nama Instance..." required 
              class="bg-slate-950/80 border border-slate-700/70 text-xs sm:text-sm rounded-2xl pl-10 pr-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 transition-all w-full">
          </div>
          <button type="submit" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-xs sm:text-sm px-5 py-3 rounded-2xl transition-all shadow-lg shadow-emerald-900/30 flex items-center justify-center gap-2 cursor-pointer active:scale-95">
            <span>+</span> Buat Server
          </button>
        </form>

        <!-- THEME SELECTOR DESKTOP -->
        <div class="hidden lg:block">
          <select id="themeSelectDesktop" onchange="changeTheme(this.value)" class="bg-slate-950/80 border border-slate-700/70 text-xs text-slate-300 rounded-2xl px-3.5 py-3 focus:outline-none focus:border-sky-500 cursor-pointer">
            <option value="sky">🌌 Tema: Sky Blue</option>
            <option value="emerald">🌿 Tema: Emerald</option>
            <option value="violet">🔮 Tema: Violet</option>
            <option value="amber">🔥 Tema: Amber</option>
          </select>
        </div>
      </div>
    </header>

    <!-- REMOTE TERMINAL -->
    <section class="bg-slate-900/70 backdrop-blur-xl border border-slate-800/80 p-5 sm:p-6 rounded-3xl shadow-2xl space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800/80 pb-3">
        <h3 class="text-sm sm:text-base font-bold text-sky-400 flex items-center gap-2">
          <span class="p-1.5 rounded-xl bg-sky-500/10 text-sky-400">💻</span> Global Terminal Command
        </h3>
        <span class="text-[11px] text-slate-400 font-medium bg-slate-950/60 px-3 py-1 rounded-full border border-slate-800">
          Auto Crash Watcher Aktif 🛡️
        </span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5">
        <input type="text" id="termFolder" placeholder="Folder (kosong = root)" 
          class="bg-slate-950/80 border border-slate-700/70 text-xs rounded-2xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 sm:col-span-3 font-medium">
        <input type="text" id="termCmd" placeholder="Perintah (contoh: npm install)" 
          class="bg-slate-950/80 border border-slate-700/70 text-xs rounded-2xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 sm:col-span-7 font-mono">
        <button onclick="runTerminal()" class="bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white font-bold text-xs px-5 py-3 rounded-2xl transition-all shadow-lg cursor-pointer sm:col-span-2 active:scale-95 flex items-center justify-center gap-1.5">
          <span>▶</span> Eksekusi
        </button>
      </div>

      <div class="relative group">
        <div class="absolute top-3 right-3 text-[10px] text-slate-400 font-mono tracking-widest bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800 flex items-center gap-1.5 shadow">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> Live Output
        </div>
        <pre id="terminalLogs" class="bg-slate-950/90 border border-slate-800/80 p-4 sm:p-5 rounded-2xl font-mono text-xs text-emerald-400 h-44 overflow-y-auto whitespace-pre-wrap break-all shadow-inner leading-relaxed">Menghubungkan ke daemon terminal...</pre>
      </div>
    </section>

    <!-- INSTANCES GRID -->
    <section class="space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-base sm:text-lg font-bold text-slate-100 flex items-center gap-2">
          <span class="p-1.5 rounded-xl bg-blue-500/10 text-blue-400">🚀</span> Active Instances & REST APIs
        </h3>
      </div>
      <div id="serverContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="col-span-full bg-slate-900/50 border border-slate-800/80 p-12 rounded-3xl text-center text-slate-400 flex flex-col items-center justify-center space-y-3">
          <div class="w-8 h-8 border-2 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-xs sm:text-sm">Memuat daftar instance server...</p>
        </div>
      </div>
    </section>

  </div>

  <script>
    // THEME SETUP
    function changeTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('reycloud_theme', theme);
      document.getElementById('themeSelectDesktop').value = theme;
      document.getElementById('themeSelectMobile').value = theme;
    }

    const savedTheme = localStorage.getItem('reycloud_theme') || 'sky';
    changeTheme(savedTheme);

    async function fetchData() {
      try {
        const res = await fetch('/api/servers');
        const data = await res.json();
        
        const termBox = document.getElementById('terminalLogs');
        const isAtBottom = termBox.scrollHeight - termBox.scrollTop <= termBox.clientHeight + 50;
        termBox.innerText = data.terminalLogs;
        if (isAtBottom) termBox.scrollTop = termBox.scrollHeight;

        const container = document.getElementById('serverContainer');
        if (data.servers.length === 0) {
          container.innerHTML = `
            <div class="col-span-full bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 p-10 rounded-3xl text-center text-slate-400 text-xs sm:text-sm space-y-2">
              <div class="text-3xl">📭</div>
              <p class="font-medium text-slate-300">Belum ada instance server aktif.</p>
              <p class="text-slate-500 text-[11px]">Silakan buat server baru melalui form di atas untuk memulai!</p>
            </div>`;
          return;
        }

        container.innerHTML = data.servers.map(s => `
          <div class="bg-slate-900/70 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-5 sm:p-6 shadow-xl flex flex-col justify-between space-y-5 transition-all hover:border-slate-700 relative overflow-hidden group">
            
            <div class="absolute top-0 left-0 right-0 h-1 ${s.running ? 'bg-gradient-to-r from-emerald-500 to-teal-400' : 'bg-gradient-to-r from-rose-500 to-red-600'}"></div>

            <div class="flex justify-between items-start gap-3">
              <div class="space-y-1">
                <h4 class="text-base sm:text-lg font-bold text-white tracking-wide font-mono flex items-center gap-2">
                  ${s.name}
                </h4>
                <div class="flex items-center gap-2">
                  <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-bold tracking-wide ${s.running ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'}">
                    <span class="w-1.5 h-1.5 rounded-full ${s.running ? 'bg-emerald-400 animate-pulse' : 'bg-rose-400'}"></span>
                    ${s.running ? 'RUNNING' : 'STOPPED'}
                  </span>
                </div>
              </div>
              <a href="/manage.html?folder=${s.name}" class="bg-slate-800/80 hover:bg-slate-700/80 text-sky-400 text-xs font-semibold px-3.5 py-2.5 rounded-2xl border border-slate-700/80 transition-all flex items-center gap-1.5 shadow-md active:scale-95 shrink-0">
                <span>⚙️</span> <span class="hidden sm:inline">Config & Files</span><span class="inline sm:hidden">Edit</span>
              </a>
            </div>

            <!-- STATS RESOURCE (CPU & RAM) -->
            <div class="grid grid-cols-2 gap-2 bg-slate-950/60 border border-slate-800/70 p-2.5 rounded-2xl">
              <div class="flex items-center gap-2 px-2">
                <span class="text-sky-400 text-xs">⚡</span>
                <div>
                  <div class="text-[9px] uppercase tracking-wider text-slate-400 font-semibold">CPU Usage</div>
                  <div class="text-xs font-mono font-bold text-slate-200">${s.running ? s.stats.cpu + '%' : '0.0%'}</div>
                </div>
              </div>
              <div class="flex items-center gap-2 px-2 border-l border-slate-800">
                <span class="text-emerald-400 text-xs">🧠</span>
                <div>
                  <div class="text-[9px] uppercase tracking-wider text-slate-400 font-semibold">RAM Usage</div>
                  <div class="text-xs font-mono font-bold text-slate-200">${s.running ? s.stats.memory + ' MB' : '0 MB'}</div>
                </div>
              </div>
            </div>

            <div class="flex gap-2.5">
              ${!s.running ? `
                <button onclick="controlServer('${s.name}', 'start')" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-xs py-3 rounded-2xl transition-all shadow-md shadow-emerald-900/20 cursor-pointer active:scale-95 flex items-center justify-center gap-1.5">
                  <span>▶</span> Start Server
                </button>
              ` : `
                <button onclick="controlServer('${s.name}', 'restart')" class="flex-1 bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white font-bold text-xs py-3 rounded-2xl transition-all shadow-md shadow-sky-900/20 cursor-pointer active:scale-95 flex items-center justify-center gap-1.5">
                  <span>🔄</span> Restart
                </button>
                <button onclick="controlServer('${s.name}', 'stop')" class="flex-1 bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-bold text-xs py-3 rounded-2xl transition-all shadow-md shadow-rose-900/20 cursor-pointer active:scale-95 flex items-center justify-center gap-1.5">
                  <span>🛑</span> Stop
                </button>
              `}
            </div>

            <div class="space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Console Output (${s.name})</span>
              </div>
              <pre class="bg-slate-950/90 border border-slate-800/80 p-3.5 rounded-2xl font-mono text-[11px] text-emerald-400 h-32 overflow-y-auto whitespace-pre-wrap break-all shadow-inner leading-relaxed">${s.logs}</pre>
            </div>

          </div>
        `).join('');

      } catch (e) {
        console.error("Gagal memuat data daemon:", e);
      }
    }

    async function controlServer(name, action) {
      await fetch(`/api/servers/${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      fetchData();
    }

    async function runTerminal() {
      const folder = document.getElementById('termFolder').value.trim();
      const command = document.getElementById('termCmd').value.trim();
      if (!command) return alert('Masukkan perintah terminal terlebih dahulu!');

      document.getElementById('termCmd').value = '';
      await fetch('/api/terminal/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ folder, command })
      });
      fetchData();
    }

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('serverName').value.trim();
      await fetch('/api/servers/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ servername: name })
      });
      document.getElementById('serverName').value = '';
      fetchData();
    });

    setInterval(fetchData, 3000);
    fetchData();
  </script>
</body>
</html>
